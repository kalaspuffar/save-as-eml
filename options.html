<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>Save Message as EML — Options</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 24px auto; max-width: 560px; }
      h1 { font-size: 18px; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      input { width: 100%; padding: 6px; box-sizing: border-box; font-family: monospace; }
      button { margin-top: 12px; padding: 6px 18px; cursor: pointer; }
      #status { margin-top: 10px; }
      .hint { color: #555; font-size: 12px; margin-top: 4px; }
    </style>
    <script src="options.js" defer="true"></script>
  </head>
  <body>
    <h1>Save Message as EML</h1>
    <label for="dir">Output directory</label>
    <input id="dir" type="text" placeholder="/home/danielp/eml-out" spellcheck="false"/>
    <div class="hint">
      Absolute path where the .eml files should end up. The Thunderbird
      extension writes to its downloads directory first, and the
      <code>eml-mover</code> service moves the file here within a second.
      Create the directory if it does not exist (the mover also creates it).
    </div>
    <button id="save">Save</button>
    <div id="status"></div>
  </body>
</html>
