<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>Save Message as EML — Options</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 24px auto; max-width: 560px; }
      h1 { font-size: 18px; }
      label { display: block; margin-bottom: 6px; font-weight: 600; }
      input { width: 100%; padding: 6px; box-sizing: border-box; font-family: monospace; }
      button { margin-top: 12px; padding: 6px 18px; cursor: pointer; }
      #status { margin-top: 10px; }
      .hint { color: #555; font-size: 12px; margin-top: 4px; }
    </style>
    <script src="options.js" defer="true"></script>
  </head>
  <body>
    <h1>Save Message as EML</h1>
    <label for="endpoint">Local endpoint</label>
    <input id="endpoint" type="text" placeholder="http://127.0.0.1:8765/eml" spellcheck="false"/>
    <div class="hint">
      Where the raw message is POSTed when you press the button.
      The reference server (see <code>server/</code>) listens there and
      writes the file to the directory you start it with. Any local
      service that accepts the POST works.
    </div>
    <button id="save">Save</button>
    <div id="status"></div>
  </body>
</html>
